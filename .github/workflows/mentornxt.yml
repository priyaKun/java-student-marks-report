# MentorNxt checks your project on every push to main, and each extra challenge on its branch (extra-1, extra-2, ...).
# Do not edit this file: MentorNxt only accepts results from this exact workflow.
name: MentorNxt check

on:
  push:
    branches: [main, 'extra-*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to exact commits (v4.4.0, v4.9.1) so what runs here can never change underneath.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Check with MentorNxt
        env:
          MENTORNXT_API: https://www.mentornxt.com/api
        run: |
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mentornxt" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -sS --fail-with-body --retry 4 --retry-all-errors --retry-delay 15 --max-time 120 \
            -X POST -H "Authorization: Bearer $ID_TOKEN" "$MENTORNXT_API/verify/runs/start" -o "$RUNNER_TEMP/start.json" \
            || { cat "$RUNNER_TEMP/start.json" 2>/dev/null; echo; echo "MentorNxt did not accept this run (see the message above)."; exit 1; }
          python3 -c 'import json,sys; open(sys.argv[2],"w").write(json.load(open(sys.argv[1]))["judge"])' "$RUNNER_TEMP/start.json" "$RUNNER_TEMP/judge.py"
          python3 "$RUNNER_TEMP/judge.py" "$RUNNER_TEMP/start.json"
